services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: data_syn
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data/tag_texts:/data/tag_texts:ro
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: data_syn
      DB_USER: data_syn_app
      DB_PASSWORD: ${DB_PASSWORD} 
  frontend:  
    build:
      context: ./frontend 
    ports:
      - "5173:5173"  # Vite 默认端口
    volumes:
      - ./frontend:/app    # 开发时热重载
      - /app/node_modules  # 避免覆盖 node_modules
    depends_on:
      - api
volumes:
  mysql_data: